<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | Opravím počítač</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth view transitions */
        .view-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .view-hidden {
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            position: absolute;
            width: 100%;
        }
        .view-visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Loading spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 0.8s linear infinite;
        }

        /* Subtle floating animation for the logo */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .logo-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Gradient background animation */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-gradient {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #1e3a5f);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
        }

        /* Skeleton loading pulse */
        @keyframes pulse-skeleton {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .skeleton {
            animation: pulse-skeleton 1.5s ease-in-out infinite;
            background: rgba(255,255,255,0.08);
            border-radius: 0.5rem;
        }

        /* Card hover lift */
        .order-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .order-card:active {
            transform: scale(0.98);
        }
        @media (hover: hover) {
            .order-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px -5px rgba(0,0,0,0.3);
            }
        }

        /* Filter tab active indicator */
        .filter-tab {
            transition: all 0.2s ease;
        }
        .filter-tab.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* Line clamp for description */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* FAB pulse */
        @keyframes fab-pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
            50% { box-shadow: 0 4px 25px rgba(59,130,246,0.6); }
        }
        .fab-btn {
            animation: fab-pulse 3s ease-in-out infinite;
        }
        .fab-btn:hover {
            animation: none;
            box-shadow: 0 8px 30px rgba(59,130,246,0.5);
        }

        /* Scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
    </style>
</head>

<body class="font-sans antialiased animated-gradient min-h-screen">

    <!-- ============================================================ -->
    <!-- VIEW: LOGIN                                                  -->
    <!-- ============================================================ -->
    <div id="view-login" class="view-transition view-visible min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <img src="../assets/logo_it_light.png" alt="Opravím počítač" class="h-20 w-auto mx-auto logo-float">
            </div>

            <!-- Login Card -->
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8 sm:p-10">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-white mb-2">Administrace</h1>
                    <p class="text-slate-400 text-sm">Přihlaste se do zakázkového systému</p>
                </div>

                <form id="login-form" class="space-y-5" autocomplete="on">
                    <!-- Email -->
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <input type="email" id="login-email" name="email" required autocomplete="email"
                                placeholder="vas@email.cz"
                                class="w-full pl-11 pr-4 py-3.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-500 text-base focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-slate-300 mb-1.5">Heslo</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <input type="password" id="login-password" name="password" required autocomplete="current-password"
                                placeholder="••••••••"
                                class="w-full pl-11 pr-4 py-3.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-500 text-base focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition">
                        </div>
                    </div>

                    <!-- Error message -->
                    <div id="login-error" class="hidden bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 text-red-300 text-sm flex items-start gap-2">
                        <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <span id="login-error-text"></span>
                    </div>

                    <!-- Submit button -->
                    <button type="submit" id="login-submit"
                        class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-xl hover:from-blue-500 hover:to-indigo-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all shadow-lg shadow-blue-600/20 hover:shadow-blue-600/40 active:scale-[0.98] flex items-center justify-center gap-2 text-base min-h-[48px]">
                        <span id="login-btn-text">Přihlásit se</span>
                        <svg id="login-btn-spinner" class="w-5 h-5 spinner hidden" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <p class="text-center text-slate-600 text-xs mt-6">&copy; 2024 Petr Urban &middot; Opravím počítač</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- VIEW: DASHBOARD                                              -->
    <!-- ============================================================ -->
    <div id="view-dashboard" class="view-transition view-hidden min-h-screen flex flex-col">
        <!-- Top Bar -->
        <header class="bg-white/5 backdrop-blur-xl border-b border-white/10 px-4 sm:px-6 py-4 sticky top-0 z-30">
            <div class="max-w-5xl mx-auto flex items-center justify-between">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

        <!-- Dashboard Content -->

                <!-- Stat Cards -->

                    <!-- Nové -->
                    <div class="bg-white/5 border border-white/10 rounded-xl p-4 sm:p-5">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div>
                            <span class="text-xs text-slate-400 font-medium">Nové</span>
                        </div>
                        <div id="stat-new" class="text-2xl sm:text-3xl font-bold text-white">

                    <!-- Probíhá -->

                        <div id="stat-done" class="text-2xl sm:text-3xl font-bold text-white">

                            </svg>
                        </div>
                        <input type="text" id="search-input" placeholder="Hledat dle jména klienta nebo čísla zakázky…"

                    <!-- Filter tabs -->
                    <div class="flex bg-white/5 border border-white/10 rounded-xl p-1 gap-0.5 flex-shrink-0">

                        <button data-filter="done" class="filter-tab px-3 sm:px-4 py-2 rounded-lg text-sm font-medium text-slate-400 min-h-[36px]">Dokončené</button>

                <!-- Order List -->

                    <div class="skeleton h-28 w-full rounded-xl"></div>
                    <div class="skeleton h-28 w-full rounded-xl"></div>

                <!-- Empty state -->

                    <p class="text-slate-400 font-medium mb-1">Zatím nemáte žádné zakázky</p>
                    <p class="text-slate-600 text-sm">Vytvořte první zakázku tlačítkem + dole</p>
                </div>

                <!-- Error state -->
                <div id="orders-error" class="hidden text-center py-16">
                    <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <p class="text-slate-400 font-medium mb-3">Nepodařilo se načíst data</p>
                    <button id="btn-retry"
                        class="px-5 py-2.5 bg-white/5 border border-white/10 text-slate-300 text-sm font-medium rounded-xl hover:bg-white/10 transition min-h-[44px]">
                        Zkusit znovu

            </div>

        <!-- FAB: + Nová zakázka -->
        <button id="fab-new-order"
            class="fab-btn fixed bottom-6 right-6 z-40 w-14 h-14 sm:w-auto sm:h-auto sm:px-5 sm:py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full sm:rounded-xl shadow-xl flex items-center justify-center gap-2 hover:from-blue-500 hover:to-indigo-500 transition-all active:scale-95 min-h-[56px]">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
            </svg>
            <span class="hidden sm:inline font-semibold text-sm">Nová zakázka</span>
        </button>

    <!-- ============================================================ -->
    <!-- SUPABASE + APP LOGIC                                         -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function () {
            'use strict';

            // --- Supabase Init (in-memory session, no localStorage) ---
            const SUPABASE_URL = 'https://jfbpajgwfdwyyljfcybj.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_Hy6z2LiOHH5P6mQa98S7LA_D-1ENSgo';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    persistSession: false,
                    autoRefreshToken: true,
                    detectSessionInUrl: false
                }
            });

            // --- DOM References: Login ---
            const viewLogin = document.getElementById('view-login');
            const viewDashboard = document.getElementById('view-dashboard');
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const errorBox = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');
            const submitBtn = document.getElementById('login-submit');
            const btnText = document.getElementById('login-btn-text');
            const btnSpinner = document.getElementById('login-btn-spinner');
            const btnLogout = document.getElementById('btn-logout');
            const userEmailEl = document.getElementById('user-email');

            // --- DOM References: Dashboard ---
            const statNew = document.getElementById('stat-new');
            const statProgress = document.getElementById('stat-progress');
            const statDone = document.getElementById('stat-done');
            const statMonthlyRevenue = document.getElementById('stat-monthly-revenue');
            const statMonthlyCount = document.getElementById('stat-monthly-count');
            const searchInput = document.getElementById('search-input');
            const ordersList = document.getElementById('orders-list');
            const ordersEmpty = document.getElementById('orders-empty');
            const ordersError = document.getElementById('orders-error');
            const btnRetry = document.getElementById('btn-retry');
            const fabBtn = document.getElementById('fab-new-order');
            const filterTabs = document.querySelectorAll('.filter-tab');

            // --- State ---
            let allOrders = [];
            let currentFilter = 'all';
            let searchQuery = '';

            // ======================================================
            // VIEW SWITCHING
            // ======================================================
            function showView(view) {
                if (view === 'dashboard') {
                    viewLogin.classList.remove('view-visible');
                    viewLogin.classList.add('view-hidden');
                    viewDashboard.classList.remove('view-hidden');
                    viewDashboard.classList.add('view-visible');
                    loadDashboard();
                } else {
                    viewDashboard.classList.remove('view-visible');
                    viewDashboard.classList.add('view-hidden');
                    viewLogin.classList.remove('view-hidden');
                    viewLogin.classList.add('view-visible');
                    loginForm.reset();
                    hideError();
                    setLoading(false);
                }
            }

            // ======================================================
            // LOGIN LOGIC (unchanged from Phase 2)
            // ======================================================
            function showError(message) {
                errorText.textContent = message;
                errorBox.classList.remove('hidden');
            }

            function hideError() {
                errorBox.classList.add('hidden');
                errorText.textContent = '';
            }

            function setLoading(loading) {
                if (loading) {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
                    btnText.textContent = 'Přihlašování…';
                    btnSpinner.classList.remove('hidden');
                } else {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                    btnText.textContent = 'Přihlásit se';
                    btnSpinner.classList.add('hidden');
                }
            }

            function translateError(message) {
                const map = {
                    'Invalid login credentials': 'Nesprávný e-mail nebo heslo.',
                    'Email not confirmed': 'E-mailová adresa nebyla potvrzena.',
                    'User not found': 'Uživatel nenalezen.',
                    'Too many requests': 'Příliš mnoho pokusů. Zkuste to později.',
                    'Network error': 'Chyba připojení. Zkontrolujte internet.',
                };
                for (const [key, value] of Object.entries(map)) {
                    if (message.includes(key)) return value;
                }
                return 'Přihlášení se nezdařilo. Zkuste to znovu.';
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                setLoading(true);

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError('Vyplňte e-mail i heslo.');
                    setLoading(false);
                    return;
                }

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        showError(translateError(error.message));
                        setLoading(false);
                        return;
                    }
                    if (data.user) {
                        userEmailEl.textContent = data.user.email;
                    }
                    showView('dashboard');
                } catch (err) {
                    showError('Chyba připojení. Zkontrolujte internet.');
                    setLoading(false);
                }
            });

            btnLogout.addEventListener('click', async () => {
                await supabase.auth.signOut();
                showView('login');
            });

            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT' || (!session && event === 'TOKEN_REFRESHED')) {
                    showView('login');
                }
            });

            // ======================================================
            // DASHBOARD: DATA LOADING
            // ======================================================

            async function loadDashboard() {
                showDashboardLoading();
                ordersError.classList.add('hidden');
                ordersEmpty.classList.add('hidden');

                try {
                    // Parallel: load stats + orders
                    const [statsResult, ordersResult] = await Promise.all([
                        loadStats(),
                        loadOrders()
                    ]);

                    if (statsResult.error) throw statsResult.error;
                    if (ordersResult.error) throw ordersResult.error;

                    renderStats(statsResult.data);
                    allOrders = ordersResult.data || [];
                    renderOrders();

                } catch (err) {
                    console.error('Dashboard load error:', err);
                    ordersList.innerHTML = '';
                    ordersError.classList.remove('hidden');
                    // Still show 0s in stats
                    renderStats({ newCount: 0, progressCount: 0, doneCount: 0, monthlyRevenue: 0, monthlyOrderCount: 0 });
                }
            }

            async function loadStats() {
                try {
                    // Count by status
                    const [resNew, resProgress, resDone, resMonthly] = await Promise.all([
                        supabase.from('orders').select('*', { count: 'exact', head: true }).eq('status', 'nová'),
                        supabase.from('orders').select('*', { count: 'exact', head: true }).eq('status', 'probíhá'),
                        supabase.from('orders').select('*', { count: 'exact', head: true }).eq('status', 'dokončena'),
                        loadMonthlyStats()
                    ]);

                    if (resNew.error) throw resNew.error;
                    if (resProgress.error) throw resProgress.error;
                    if (resDone.error) throw resDone.error;

                    return {
                        data: {
                            newCount: resNew.count || 0,
                            progressCount: resProgress.count || 0,
                            doneCount: resDone.count || 0,
                            monthlyRevenue: resMonthly.revenue,
                            monthlyOrderCount: resMonthly.count
                        }
                    };
                } catch (error) {
                    return { error };
                }
            }

            async function loadMonthlyStats() {
                const now = new Date();
                const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();

                const { data, error } = await supabase
                    .from('orders')
                    .select('total_price')
                    .gte('date_created', firstOfMonth);

                if (error) throw error;

                const revenue = (data || []).reduce((sum, o) => sum + (parseFloat(o.total_price) || 0), 0);
                return { revenue, count: (data || []).length };
            }

            async function loadOrders() {
                const { data, error } = await supabase
                    .from('orders')
                    .select('*, clients(name)')
                    .order('date_created', { ascending: false });

                return { data, error };
            }

            // ======================================================
            // DASHBOARD: RENDERING
            // ======================================================

            function showDashboardLoading() {
                // Stats skeleton
                statNew.innerHTML = '<div class="skeleton h-8 w-12"></div>';
                statProgress.innerHTML = '<div class="skeleton h-8 w-12"></div>';
                statDone.innerHTML = '<div class="skeleton h-8 w-12"></div>';
                statMonthlyRevenue.innerHTML = '<div class="skeleton h-8 w-20"></div>';
                statMonthlyCount.textContent = '';

                // Orders skeleton
                ordersList.innerHTML = `
                    <div class="skeleton h-28 w-full rounded-xl"></div>
                    <div class="skeleton h-28 w-full rounded-xl"></div>
                    <div class="skeleton h-28 w-full rounded-xl"></div>
                `;
            }

            function renderStats(stats) {
                statNew.textContent = stats.newCount;
                statProgress.textContent = stats.progressCount;
                statDone.textContent = stats.doneCount;
                statMonthlyRevenue.textContent = formatPrice(stats.monthlyRevenue);
                statMonthlyCount.textContent = stats.monthlyOrderCount > 0
                    ? `${stats.monthlyOrderCount} ${pluralOrders(stats.monthlyOrderCount)}`
                    : 'žádné zakázky';
            }

            function renderOrders() {
                const filtered = getFilteredOrders();

                if (filtered.length === 0 && allOrders.length === 0) {
                    ordersList.innerHTML = '';
                    ordersEmpty.classList.remove('hidden');
                    return;
                }

                ordersEmpty.classList.add('hidden');

                if (filtered.length === 0) {
                    ordersList.innerHTML = `
                        <div class="text-center py-12">
                            <p class="text-slate-500 text-sm">Žádné zakázky neodpovídají filtru</p>
                        </div>
                    `;
                    return;
                }

                ordersList.innerHTML = filtered.map(order => renderOrderCard(order)).join('');
            }

            function renderOrderCard(order) {
                const clientName = order.clients?.name || 'Neznámý klient';
                const statusBadge = getStatusBadge(order.status);
                const date = order.date_created ? formatDate(order.date_created) : '—';
                const price = order.total_price ? formatPrice(order.total_price) : '';
                const description = order.description || 'Bez popisu';

                return `
                    <div class="order-card bg-white/5 border border-white/10 rounded-xl p-4 sm:p-5 cursor-pointer">
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1 flex-wrap">
                                    <span class="text-white font-semibold text-sm">${escapeHtml(order.order_number || '—')}</span>
                                    ${statusBadge}
                                </div>
                                <p class="text-slate-300 text-sm font-medium">${escapeHtml(clientName)}</p>
                            </div>
                            ${price ? `<span class="text-white font-bold text-sm whitespace-nowrap">${price}</span>` : ''}
                        </div>
                        <p class="text-slate-500 text-xs line-clamp-2 mb-3">${escapeHtml(description)}</p>
                        <div class="flex items-center gap-1.5 text-slate-600 text-xs">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            ${date}
                        </div>
                    </div>
                `;
            }

            function getStatusBadge(status) {
                const badges = {
                    'nová': '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-500/15 text-blue-400 border border-blue-500/20">Nová</span>',
                    'probíhá': '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-amber-500/15 text-amber-400 border border-amber-500/20">Probíhá</span>',
                    'dokončena': '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/20">Dokončena</span>',
                    'fakturováno': '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-500/15 text-indigo-400 border border-indigo-500/20">Fakturováno</span>',
                };
                return badges[status] || `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-white/10 text-slate-400">${escapeHtml(status || '—')}</span>`;
            }

            // ======================================================
            // FILTERING + SEARCH
            // ======================================================

            function getFilteredOrders() {
                let filtered = [...allOrders];

                // Filter by status tab
                if (currentFilter === 'active') {
                    filtered = filtered.filter(o => o.status === 'nová' || o.status === 'probíhá');
                } else if (currentFilter === 'done') {
                    filtered = filtered.filter(o => o.status === 'dokončena' || o.status === 'fakturováno');
                }

                // Search
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(o => {
                        const clientName = (o.clients?.name || '').toLowerCase();
                        const orderNumber = (o.order_number || '').toLowerCase();
                        return clientName.includes(q) || orderNumber.includes(q);
                    });
                }

                return filtered;
            }

            // Filter tabs click
            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    filterTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderOrders();
                });
            });

            // Search input with debounce
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchQuery = searchInput.value.trim();
                    renderOrders();
                }, 250);
            });

            // Retry button
            btnRetry.addEventListener('click', () => {
                loadDashboard();
            });

            // FAB button (placeholder for Phase 4)
            fabBtn.addEventListener('click', () => {
                alert('Formulář zakázky bude implementován ve Fázi 4.');
            });

            // ======================================================
            // HELPERS
            // ======================================================

            function formatPrice(amount) {
                const num = parseFloat(amount) || 0;
                return num.toLocaleString('cs-CZ') + ' Kč';
            }

            function formatDate(dateStr) {
                try {
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'short', year: 'numeric' });
                } catch {
                    return dateStr;
                }
            }

            function pluralOrders(count) {
                if (count === 1) return 'zakázka';
                if (count >= 2 && count <= 4) return 'zakázky';
                return 'zakázek';
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ======================================================
            // INITIAL AUTH GUARD
            // ======================================================
            (async () => {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    userEmailEl.textContent = session.user.email;
                    showView('dashboard');
                } else {
                    showView('login');
                }
            })();

        })();
    </script>

</body>

</html>
